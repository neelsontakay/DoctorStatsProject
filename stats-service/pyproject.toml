[project]
name = "doctorstats-stats-service"
version = "0.1.0"
description = "DoctorStats statistical analysis microservice (FastAPI)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
